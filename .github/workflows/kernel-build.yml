name: kernel-build

on:
  push:
    branches: [main, ci/fix-build]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      kpm:
        description: "Enable KPM (KernelPatch loader) in the sukisu variant"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: kernel-build-${{ github.ref }}
  cancel-in-progress: true

env:
  LLVM_VER: 23.1.1
  DEFCONFIG: marble_defconfig

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        variant: [susfs, sukisu]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev libncurses-dev \
            zstd lz4 device-tree-compiler cpio ccache python3 rsync

      - name: Fetch LLVM toolchain
        run: |
          mkdir -p ~/toolchains
          cd ~/toolchains
          curl -fsSL --retry 3 -o llvm.tar.xz \
            "https://mirrors.edge.kernel.org/pub/tools/llvm/files/llvm-${LLVM_VER}-x86_64.tar.xz"
          mkdir -p llvm-${LLVM_VER}
          tar -xJf llvm.tar.xz -C llvm-${LLVM_VER} --strip-components=1
          rm llvm.tar.xz
          # A cached toolchain from a run that died before upload can come back
          # empty, which shows up much later as "linker 'ld.lld' not found".
          test -x "llvm-${LLVM_VER}/bin/ld.lld" \
            || { echo "::error::ld.lld missing after extract"; exit 1; }
          echo "$HOME/toolchains/llvm-${LLVM_VER}/bin" >> $GITHUB_PATH
          "llvm-${LLVM_VER}/bin/clang" --version

      - name: Set up environment
        run: |
          # $HOME, not ~ — GitHub Actions does not tilde-expand values written
          # to GITHUB_ENV, so a literal ~ yields a path that does not exist.
          echo "CLANG_PATH=$HOME/toolchains/llvm-${LLVM_VER}/bin" >> $GITHUB_ENV
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
          echo "KBUILD_BUILD_HOST=github-actions" >> $GITHUB_ENV
          echo "KBUILD_BUILD_USER=yomi16" >> $GITHUB_ENV
          echo "PATH=$HOME/.ccache:$PATH" >> $GITHUB_ENV
          ccache --max-size=10G
          ccache --zero-stats || true

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.variant }}-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.variant }}-${{ runner.os }}-

      - name: Configure
        run: |
          export PATH="$CLANG_PATH:$PATH"
          clang --version
          make ARCH=arm64 mrproper
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 O=out $DEFCONFIG
          FRAGMENTS="arch/arm64/configs/vendor/yomi16_bbr2.fragment"
          case "${{ matrix.variant }}" in
            susfs) FRAGMENTS="$FRAGMENTS arch/arm64/configs/vendor/yomi16_susfs.fragment" ;;
            sukisu)
              FRAGMENTS="$FRAGMENTS arch/arm64/configs/vendor/yomi16_sukisu.fragment"
              if [ "${{ inputs.kpm }}" = "true" ]; then
                FRAGMENTS="$FRAGMENTS arch/arm64/configs/vendor/yomi16_sukisu_kpm.fragment"
              fi
              ;;
          esac
          echo "merging: $FRAGMENTS"
          # merge_config.sh takes the base config as its first positional arg.
          # Without it (-m -O out alone) it writes a fresh file containing only
          # the fragment lines and drops the rest of the defconfig.
          scripts/kconfig/merge_config.sh -m -O out \
            arch/arm64/configs/$DEFCONFIG $FRAGMENTS
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 O=out olddefconfig

      - name: Build
        run: |
          export PATH="$CLANG_PATH:$PATH"
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 O=out -j$(nproc) \
            KCFLAGS="-D__ANDROID_COMMON_KERNEL__ -O3" \
            KBUILD_LDFLAGS="-O3 --lto-O3" all

      - name: ccache stats
        if: always()
        run: ccache --show-stats

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Image-${{ matrix.variant }}
          path: |
            out/arch/arm64/boot/Image
            out/.config
            out/vmlinux.symvers
          if-no-files-found: error
          retention-days: 14