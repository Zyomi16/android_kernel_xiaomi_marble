name: kernel-build

on:
  push:
    branches: [merge/all-branches]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-build-${{ github.ref }}
  cancel-in-progress: true

env:
  LLVM_VER: 23.1.1
  DEFCONFIG: marble_defconfig

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: stock
            fragment: none
          - variant: susfs
            fragment: yomi16_susfs.fragment
          - variant: sukisu
            fragment: yomi16_sukisu.fragment

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev libncurses-dev \
            zstd lz4 device-tree-compiler cpio ccache python3 rsync

      - name: Cache LLVM toolchain
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: ~/toolchains/llvm-${{ env.LLVM_VER }}
          key: llvm-${{ env.LLVM_VER }}-${{ runner.os }}-${{ runner.arch }}

      - name: Fetch LLVM toolchain
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/toolchains
          cd ~/toolchains
          curl -fsSL -o llvm.tar.xz \
            "https://mirrors.edge.kernel.org/pub/tools/llvm/files/llvm-${LLVM_VER}-x86_64.tar.xz"
          mkdir -p llvm-${LLVM_VER}
          tar -xJf llvm.tar.xz -C llvm-${LLVM_VER} --strip-components=1
          rm llvm.tar.xz

      - name: Set up environment
        run: |
          echo "CLANG_PATH=~/toolchains/llvm-${LLVM_VER}/bin" >> $GITHUB_ENV
          echo "CCACHE_DIR=/home/runner/.ccache" >> $GITHUB_ENV
          echo "KBUILD_BUILD_HOST=github-actions" >> $GITHUB_ENV
          echo "KBUILD_BUILD_USER=yomi16" >> $GITHUB_ENV
          echo "PATH=/home/runner/.ccache:$PATH" >> $GITHUB_ENV
          ccache --max-size=10G
          ccache --zero-stats || true

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.variant }}-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.variant }}-${{ runner.os }}-

      - name: Configure
        run: |
          export PATH="$CLANG_PATH:$PATH"
          clang --version
          make mrproper
          make LLVM=1 LLVM_IAS=1 O=out $DEFCONFIG
          # bbr2 fragment applies to both variants; susfs only to the susfs one
          FRAGMENTS="arch/arm64/configs/vendor/yomi16_bbr2.fragment"
          if [ "${{ matrix.fragment }}" != "none" ]; then
            FRAGMENTS="$FRAGMENTS arch/arm64/configs/vendor/${{ matrix.fragment }}"
          fi
          echo "merging: $FRAGMENTS"
          scripts/kconfig/merge_config.sh -m -O out $FRAGMENTS
          make LLVM=1 LLVM_IAS=1 O=out olddefconfig

      - name: Build
        run: |
          export PATH="$CLANG_PATH:$PATH"
          make LLVM=1 LLVM_IAS=1 O=out -j$(nproc) \
            KCFLAGS="-D__ANDROID_COMMON_KERNEL__ -O3" \
            KBUILD_LDFLAGS="-O3 --lto-O3" all

      - name: ccache stats
        if: always()
        run: ccache --show-stats

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Image-${{ matrix.variant }}
          path: |
            out/arch/arm64/boot/Image
            out/.config
            out/vmlinux.symvers
          if-no-files-found: error
          retention-days: 14